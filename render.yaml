services:
  - type: web
    name: btq-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: ./build.sh
    startCommand: uv run --no-sync gunicorn config.wsgi --chdir src --workers 2 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/docs
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      # Values below are entered in the Render dashboard (sync: false = not stored here).
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_DOMAIN
        sync: false
      - key: FRONTEND_REVALIDATE_URL
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
